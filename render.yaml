services:
  - type: web
    name: cs-interview-coach-pro
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeployTrigger: checksPass
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_VOICE
        value: Kore
